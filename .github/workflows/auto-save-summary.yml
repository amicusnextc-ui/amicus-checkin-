name: Auto-save Weekly Summary to Notion

on:
  schedule:
    # Every Sunday 5:30pm LA — 1hr after checkout (4:30pm). 00:30 UTC Mon = 5:30pm PDT / 4:30pm PST
    - cron: '30 0 * * 1'
  workflow_dispatch:  # allow manual trigger via Actions tab

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /api/weekly-summary
        run: |
          curl -X POST https://amicus-checkin.vercel.app/api/weekly-summary \
            -H 'Content-Type: application/json' \
            -d '{}' \
            --fail \
            --show-error
