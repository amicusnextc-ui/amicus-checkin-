name: Sunday Wrap-up Reminder

# Runs every Monday at 9am PT (Monday 4pm UTC)
# Checks if any dept missed submitting weekly wrap-up note
# Sends reminder email via Resend to missing dept staff

on:
  schedule:
    - cron: '0 16 * * 1'  # Mon 4pm UTC = Mon 9am PT
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check missing dept reports
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat <<'JS' > check.js
          const REQUESTS_DB = 'd25f9fdaeeb748ac97ffda2f68f776bb';
          const DEPTS = ['\uC720\uC544\uBD80', '\uC720\uCE58\uBD80', '\uC720\uB144\uBD80', '\uCD08\uB4F1\uBD80', '\uC911\uACE0\uB4F1\uBD80'];
          const EMAILS = {
            director: 'amicusnextc@gmail.com',
            buJang: 'gunnixe@gmail.com',
            wiWonJang: 'Drjameschoi@hotmail.com',
            deptStaff: {
              '\uC720\uC544\uBD80': 'wise0331@gmail.com',
              '\uC720\uCE58\uBD80': 'flower5425@gmail.com',
              '\uC720\uB144\uBD80': '86eunhye@gmail.com',
              '\uCD08\uB4F1\uBD80': 'jinjoopearl19@gmail.com',
              '\uC911\uACE0\uB4F1\uBD80': 'amicusnextc@gmail.com'
              // TODO: add other dept staff emails
            }
          };
          
          function getServiceSundayISO(){
            const now = new Date();
            const laOffset = -8 * 60; // PT roughly UTC-8 (ignore DST nuance for cron)
            const la = new Date(now.getTime() + laOffset * 60 * 1000);
            const day = la.getUTCDay();
            const d = new Date(la);
            if(day !== 0) d.setUTCDate(d.getUTCDate() - day);
            return d.toISOString().slice(0, 10);
          }
          
          (async () => {
            const sundayISO = getServiceSundayISO();
            console.log('Checking Sunday:', sundayISO);
            const [mm, dd] = sundayISO.slice(5).split('-');
            const sundayMD = parseInt(mm,10) + '/' + parseInt(dd,10);
            
            // Query Notion requests DB
            const queryRes = await fetch('https://api.notion.com/v1/databases/' + REQUESTS_DB + '/query', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.NOTION_TOKEN,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                filter: {
                  timestamp: 'created_time',
                  created_time: { on_or_after: sundayISO + 'T00:00:00.000Z' }
                },
                page_size: 50
              })
            });
            
            if(!queryRes.ok){
              console.error('Notion query failed:', await queryRes.text());
              process.exit(1);
            }
            
            const data = await queryRes.json();
            const submittedDepts = new Set();
            
            (data.results || []).forEach(page => {
              const props = page.properties || {};
              const content = (props['\uB0B4\uC6A9']?.rich_text?.[0]?.plain_text || '') 
                            + ' ' + (props['title']?.title?.[0]?.plain_text || '');
              const dept = (props['\uBD80\uC11C']?.select?.name || props['\uBD80\uC11C']?.rich_text?.[0]?.plain_text || '').trim();
              
              // Check if any dept name + sundayMD reference in content
              DEPTS.forEach(d => {
                if(dept.indexOf(d) >= 0 && (content.indexOf(sundayMD) >= 0 || content.indexOf(sundayISO) >= 0 || content.indexOf('\uD2B9\uC774\uC0AC\uD56D') >= 0)){
                  submittedDepts.add(d);
                }
              });
            });
            
            const missing = DEPTS.filter(d => !submittedDepts.has(d));
            console.log('Submitted:', [...submittedDepts]);
            console.log('Missing:', missing);
            
            if(missing.length === 0){
              console.log('All depts submitted. No reminders.');
              return;
            }
            
            // Send reminder email via Resend
            const subject = '[Amicus-checkin] ' + sundayMD + ' \uD2B9\uC774\uC0AC\uD56D \uC5C5\uB370\uC774\uD2B8 \uBC14\uB78D\uB2C8\uB2E4.';
            const html = '<p>' + missing.join(', ') + ' \uBD80\uC11C \uAC04\uC0AC\uB2D8\uAED8</p><p>' + sundayMD + ' \uC8FC\uC77C\uC5D0 \uB300\uD55C \uD2B9\uC774\uC0AC\uD56D \uC785\uB825\uC774 \uC544\uC9C1 \uC5C6\uC2B5\uB2C8\uB2E4.</p><p>staff.html \uC5D0\uC11C \uAC04\uC0AC \uC694\uCCAD\uC73C\uB85C \uB0A8\uACA8\uC8FC\uC138\uC694. (\uD2B9\uC774\uC0AC\uD56D \uC5C6\uC744 \uACBD\uC6B0 "\uC5C6\uC74C"\uC73C\uB85C\uB3C4 OK)</p>';
            
            const emailRes = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.RESEND_API_KEY,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                from: 'noreply@amicuschurch.com',
                to: [EMAILS.director, EMAILS.buJang, EMAILS.wiWonJang, ...missing.map(d => EMAILS.deptStaff[d]).filter(Boolean)],
                subject: subject,
                html: html
              })
            });
            
            const emailJson = await emailRes.json();
            console.log('Email send:', emailRes.status, emailJson);
            if(!emailRes.ok) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node check.js
