name: Sunday Wrap-up Reminder

# Runs every Monday at 9am PT (Monday 4pm UTC)
# Per-dept personalized reminders. Detects 🗓️ title OR M/D date prefix content.
# 2026-08: leadership summary now includes attendance numbers (weekly-summary API)
#          and a consecutive-absence follow-up list with contact-reason tags.

on:
  schedule:
    - cron: '0 16 * * 1'  # Mon 4pm UTC = Mon 9am PT
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check missing dept reports
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat <<'JS' > check.js
          const NOTION_TOKEN = process.env.NOTION_TOKEN;
          const RESEND_API_KEY = process.env.RESEND_API_KEY;
          const REQUESTS_DB = 'd25f9fdaeeb748ac97ffda2f68f776bb';
          const ABSENTEES_DB = 'de7bb42e89254fad949dde9123cd4cdb';
          const API_BASE = 'https://amicus-checkin.vercel.app';
          const API_KEY = 'AMICUS-PUBLIC-KIOSK-V1';

          const DEPTS = {
            '유아부': { staff: '이지혜', email: 'wise0331@gmail.com' },
            '유치부': { staff: '김향숙', email: 'flower5425@gmail.com' },
            '유년부': { staff: '박은혜', email: '86eunhye@gmail.com' },
            '초등부': { staff: '백진주', email: 'jinjoopearl19@gmail.com' },
            '중고등부': { staff: '박명철', email: 'amicusnextc@gmail.com' }
          };

          const LEADERS = {
            director: 'amicusnextc@gmail.com',
            buJang: 'gunnixe@gmail.com',
            wiWonJang: 'Drjameschoi@hotmail.com'
          };

          const WRAPUP_TITLE = '🗓️ 주일 마무리';

          function getSunday() {
            const d = new Date();
            d.setDate(d.getDate() - d.getDay());
            return {
              iso: d.toISOString().slice(0, 10),
              short: (d.getMonth() + 1) + '/' + d.getDate(),
              month: d.getMonth() + 1,
              day: d.getDate()
            };
          }

          function isWrapupSubmission(req, sundayShort) {
            // Date-strict match — title alone caused last week's wrap-ups to leak (Task #266)
            const content = req.content || '';
            const dateMatch = content.match(/^(\d+\/\d+)/);
            return dateMatch && dateMatch[1] === sundayShort;
          }

          function getDept(req) {
            const d = req.department || '';
            for (const name of Object.keys(DEPTS)) {
              if (d.indexOf(name) === 0) return name;
            }
            return null;
          }

          async function notionQuery(dbId, body) {
            const r = await fetch('https://api.notion.com/v1/databases/' + dbId + '/query', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + NOTION_TOKEN,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(body || { page_size: 100 })
            });
            if (!r.ok) throw new Error('Notion query ' + dbId + ' failed: ' + (await r.text()));
            return r.json();
          }

          async function sendEmail(to, subject, html) {
            const r = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + RESEND_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ from: 'Amicus 교육부 <noreply@amicuschurch.com>', to: Array.isArray(to) ? to : [to], subject, html })
            });
            const body = await r.json().catch(() => ({}));
            return { status: r.status, id: body.id || body.message || '' };
          }

          // ── Attendance stats from weekly-summary API (Task: 리더십 요약에 출석 숫자 합류) ──
          async function fetchStats() {
            try {
              const r = await fetch(API_BASE + '/api/weekly-summary', { headers: { 'x-api-key': API_KEY } });
              if (!r.ok) { console.warn('weekly-summary HTTP ' + r.status); return null; }
              return await r.json();
            } catch (e) { console.warn('weekly-summary fetch failed:', e.message); return null; }
          }

          function attendanceHtml(stats) {
            if (!stats || !stats.rows || !stats.grand) return '';
            const rows = stats.rows.map(r =>
              '<tr><td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;">' + (r.short || r.dept) + '</td>' +
              '<td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:right;color:#059669;font-weight:700;">' + (r.checkin || 0) + '</td>' +
              '<td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:right;color:#dc2626;">' + (r.absent || 0) + '</td>' +
              '<td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:right;color:#6b7280;">' + (r.visitor || 0) + '</td>' +
              '<td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:right;">' + (r.total || 0) + '</td></tr>'
            ).join('');
            const g = stats.grand;
            return '<h3 style="color:#111827;font-size:15px;margin:20px 0 8px 0;">📊 ' + (stats.sundayStr || '') + ' 출석</h3>' +
              '<div style="background:#eef2ff;border-radius:8px;padding:10px 12px;margin:0 0 10px 0;font-size:14px;">' +
              '<strong>등록 ' + g.total + '명 중 출석 ' + g.checkin + '명 · 결석 ' + g.absent + '명' + (g.visitor ? ' · 방문 ' + g.visitor + '명' : '') + '</strong></div>' +
              '<table style="border-collapse:collapse;width:100%;font-size:13px;">' +
              '<tr style="color:#6b7280;"><th style="text-align:left;padding:6px 10px;">부서</th><th style="text-align:right;padding:6px 10px;">출석</th><th style="text-align:right;padding:6px 10px;">결석</th><th style="text-align:right;padding:6px 10px;">방문</th><th style="text-align:right;padding:6px 10px;">등록</th></tr>' +
              rows + '</table>';
          }

          // ── Consecutive-absence follow-up with reason tags (Task: 결석자 태그를 통계로) ──
          async function absenceFollowupHtml(stats, sunday) {
            if (!stats || !stats.absentList || stats.absentList.length === 0) return '';
            // Latest contact reason per student from 결석자 DB
            const reasons = {};
            try {
              const recs = await notionQuery(ABSENTEES_DB, {
                sorts: [{ timestamp: 'created_time', direction: 'descending' }], page_size: 100
              });
              (recs.results || []).forEach(p => {
                const nm = p.properties['학생 이름 (Student)']?.title?.[0]?.plain_text;
                const rs = p.properties['연락 사유 / 메모 (Reason)']?.rich_text?.[0]?.plain_text || '';
                if (nm && rs && !reasons[nm]) reasons[nm] = rs;
              });
            } catch (e) { console.warn('absentees query failed:', e.message); }

            const sunMs = new Date(sunday.iso + 'T00:00:00Z').getTime();
            const flagged = stats.absentList.map(a => {
              let weeks = null;
              if (a.lastAttended) weeks = Math.max(1, Math.round((sunMs - new Date(a.lastAttended + 'T00:00:00Z').getTime()) / (7 * 86400000)));
              return { ...a, weeks, reason: reasons[a.name] || '' };
            }).filter(a => a.weeks === null || a.weeks >= 3)
              .sort((a, b) => (b.weeks || 99) - (a.weeks || 99));

            if (flagged.length === 0) return '';

            // Reason tag statistics
            const tagCount = {};
            flagged.forEach(a => { if (a.reason) tagCount[a.reason] = (tagCount[a.reason] || 0) + 1; });
            const tagLine = Object.keys(tagCount).length
              ? '<p style="font-size:12px;color:#6b7280;margin:8px 0 0 0;">사유 태그: ' +
                Object.entries(tagCount).sort((a, b) => b[1] - a[1]).map(([t, n]) => t + ' ' + n + '명').join(' · ') + '</p>'
              : '';

            const rows = flagged.slice(0, 15).map(a =>
              '<tr><td style="padding:5px 10px;border-bottom:1px solid #fde68a;font-weight:600;">' + a.name + '</td>' +
              '<td style="padding:5px 10px;border-bottom:1px solid #fde68a;color:#6b7280;">' + ((a.dept || '').split(' ')[0]) + '</td>' +
              '<td style="padding:5px 10px;border-bottom:1px solid #fde68a;color:#b45309;font-weight:700;">' + (a.weeks === null ? '기록 없음' : a.weeks + '주') + '</td>' +
              '<td style="padding:5px 10px;border-bottom:1px solid #fde68a;color:#6b7280;">' + (a.reason || '—') + '</td></tr>'
            ).join('');
            const more = flagged.length > 15 ? '<p style="font-size:12px;color:#9ca3af;margin:6px 0 0 0;">외 ' + (flagged.length - 15) + '명 — staff.html 📞 결석자 탭 참고</p>' : '';

            return '<h3 style="color:#111827;font-size:15px;margin:20px 0 8px 0;">📞 3주 이상 결석 팔로업 (' + flagged.length + '명)</h3>' +
              '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 4px;">' +
              '<table style="border-collapse:collapse;width:100%;font-size:13px;">' +
              '<tr style="color:#92400e;"><th style="text-align:left;padding:5px 10px;">이름</th><th style="text-align:left;padding:5px 10px;">부서</th><th style="text-align:left;padding:5px 10px;">결석</th><th style="text-align:left;padding:5px 10px;">최근 연락 사유</th></tr>' +
              rows + '</table></div>' + tagLine + more;
          }

          async function main() {
            const sunday = getSunday();
            console.log('Checking Sunday:', sunday.iso);

            // Task #266: Skip if no service (e.g. 연합예배 — 0 check-ins)
            const ATTENDANCE_DB = '89b6c47f85a842968493ce28ad93f8de';
            const attData = await notionQuery(ATTENDANCE_DB, {
              filter: { property: '주일 날짜 (Date)', date: { equals: sunday.iso } },
              page_size: 5
            });
            const attCount = (attData.results || []).length;
            console.log('Attendance records for', sunday.iso, ':', attCount);
            if (attCount === 0) {
              console.log('No service detected (0 attendance records). Skipping wrap-up reminders.');
              if (RESEND_API_KEY) {
                await sendEmail(LEADERS.director,
                  '[Amicus-checkin] ' + sunday.short + ' 주일 마무리 cron skip (예배 없음 감지)',
                  '<div style="font-family:sans-serif;padding:20px;"><h2>🛑 ' + sunday.short + ' 주일 마무리 cron skip</h2><p>' + sunday.iso + ' 출석 기록 0건 감지 — 연합예배/특별주간으로 판단해서 wrap-up 리마인드 이메일을 건너뛰었습니다.</p><p style="font-size:13px;color:#6b7280;">만약 정상 예배가 있었는데 출석 기록 누락이라면 director.html → 주일 마무리 탭 → 리마인드 버튼으로 수동 발송 가능합니다.</p></div>');
              }
              return;
            }

            const data = await notionQuery(REQUESTS_DB, { page_size: 100 });

            const reqs = (data.results || []).map(p => {
              const props = p.properties || {};
              const titleProp = props['제목 (Title)'];
              const contentProp = props['요청 내용 (Content)'];
              const requesterProp = props['요청자 (Requester)'];
              const deptProp = props['부서 (Department)'];
              const statusProp = props['상태 (Status)'];
              return {
                id: p.id,
                title: (titleProp && titleProp.title && titleProp.title[0] && titleProp.title[0].plain_text) || '',
                content: (contentProp && contentProp.rich_text && contentProp.rich_text[0] && contentProp.rich_text[0].plain_text) || '',
                requester: (requesterProp && requesterProp.rich_text && requesterProp.rich_text[0] && requesterProp.rich_text[0].plain_text) || '',
                department: (deptProp && deptProp.select && deptProp.select.name) || '',
                status: (statusProp && statusProp.select && statusProp.select.name) || ''
              };
            });

            const submittedDepts = new Set();
            reqs.forEach(req => {
              if (isWrapupSubmission(req, sunday.short)) {
                const dept = getDept(req);
                if (dept) submittedDepts.add(dept);
              }
            });

            const submittedArr = [...submittedDepts];
            const missing = Object.keys(DEPTS).filter(d => !submittedDepts.has(d));

            console.log('Submitted:', submittedArr);
            console.log('Missing:', missing);

            // Individual personalized email per missing dept (no CC — privacy)
            for (const dept of missing) {
              const info = DEPTS[dept];
              const subject = '[Amicus-checkin] ' + sunday.short + ' ' + dept + ' 주일 마무리 보고 부탁드립니다 🗓️';
              const html = '<div style="font-family:-apple-system,Segoe UI,Helvetica,sans-serif;color:#111827;max-width:560px;margin:0 auto;padding:20px;">' +
                '<h2 style="color:#6366f1;font-size:20px;margin:0 0 16px 0;">🗓️ ' + dept + ' 마무리 - ' + sunday.short + '</h2>' +
                '<p style="font-size:15px;line-height:1.6;color:#374151;"><strong>' + info.staff + ' 간사님 안녕하세요!</strong><br><br>' +
                sunday.month + '월 ' + sunday.day + '일 주일에 대한 마무리 보고가 아직 등록되지 않았습니다.</p>' +
                '<div style="background:#f3f4f6;border-left:4px solid #6366f1;border-radius:8px;padding:14px;margin:20px 0;">' +
                '<p style="margin:0;font-size:14px;color:#374151;">📝 <strong>staff.html → 🗓️ 주일 마무리 탭</strong>에서 작성해주세요.<br>' +
                '특이사항이 없으면 <strong>[⚡ 없음]</strong> 버튼 클릭 OK!</p></div>' +
                '<p style="font-size:14px;color:#6b7280;">🔗 <a href="https://amicus-checkin.vercel.app/staff.html" style="color:#6366f1;">amicus-checkin.vercel.app/staff.html</a></p>' +
                '<hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0;">' +
                '<p style="font-size:12px;color:#9ca3af;text-align:center;">Amicus Presbyterian Church · 교육부<br>이 메일은 자동 발송되었습니다.</p></div>';

              const r = await sendEmail(info.email, subject, html);
              console.log('Sent to ' + dept + ' (' + info.staff + ', ' + info.email + '): ' + r.status, r.id);
              await new Promise(rs => setTimeout(rs, 500));  // rate limit
            }

            // Leadership summary — always sent (wrap-up status + attendance numbers + absence follow-up)
            const stats = await fetchStats();
            const attHtml = attendanceHtml(stats);
            const followupHtml = await absenceFollowupHtml(stats, sunday);

            const summarySubject = '[Amicus-checkin] ' + sunday.short + ' 주일 요약 — 출석 ' +
              (stats && stats.grand ? stats.grand.checkin + '/' + stats.grand.total : '?') +
              (missing.length ? ' · 마무리 미제출 ' + missing.length : ' · 마무리 전부 제출 ✅');
            const submittedListHtml = submittedArr.length === 0 ? '없음' : submittedArr.map(d => '✅ ' + d).join('<br>');
            const missingListHtml = missing.length === 0 ? '없음 🎉' : missing.map(d => '⏳ ' + d + ' (' + DEPTS[d].staff + ' 간사)').join('<br>');
            const summaryHtml = '<div style="font-family:-apple-system,sans-serif;max-width:560px;margin:0 auto;padding:20px;color:#111827;">' +
              '<h2 style="color:#6366f1;">🗓️ ' + sunday.short + ' 주일 요약</h2>' +
              attHtml +
              '<h3 style="color:#111827;font-size:15px;margin:20px 0 8px 0;">📝 주일 마무리 보고</h3>' +
              '<div style="background:#d1fae5;border-radius:8px;padding:12px;margin:12px 0;"><strong>제출 완료 (' + submittedArr.length + '):</strong><br>' + submittedListHtml + '</div>' +
              '<div style="background:#fef3c7;border-radius:8px;padding:12px;margin:12px 0;"><strong>미제출 (' + missing.length + '):</strong><br>' + missingListHtml + '</div>' +
              (missing.length ? '<p style="font-size:13px;color:#6b7280;">미제출 간사들에게 개별 리마인드 이메일을 발송했습니다.</p>' : '') +
              followupHtml +
              '<hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0;">' +
              '<p style="font-size:12px;color:#9ca3af;text-align:center;">Amicus Presbyterian Church · 교육부 · 이 메일은 자동 발송되었습니다.</p></div>';

            const sr = await sendEmail([LEADERS.director, LEADERS.buJang, LEADERS.wiWonJang], summarySubject, summaryHtml);
            console.log('Summary sent to leaders: ' + sr.status, sr.id);
          }

          main().catch(e => {
            console.error('Error:', e.message);
            process.exit(1);
          });
          JS
          node check.js
